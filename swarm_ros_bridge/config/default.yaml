
config:
  debug: false                    # for debug only
  odom_convert: true              # convert odom to posestamped using odom_convert_node
  monitor_node: true              # check recv rate
  warn_threshold: 3               # if recv rate smaller than max_freq-warn_threashold, then warn
  monitor_rate_hz: 500            # it must be greater than max_freq

zenoh:
  mode: peer
  multicast_scouting: true
  gossip_scouting: true
  compression_enabled: false      # JPEG/Draco are already compressed
  listen_endpoints: []            # control session: Zenoh's default TCP peer listener
  connect_endpoints: []           # static seed peers when multicast is unavailable
  seed_from_ip_table: false
  seed_port: 7447
  service_timeout_ms: 1000
  service_worker_threads: 2
  service_queue_capacity: 64
  # A second, UDP-only Zenoh session carries sensor_msgs/Image topics.
  # The control session remains TCP-only for state, commands and services.
  image_session:
    enabled: true
    multicast_scouting: true
    gossip_scouting: true
    compression_enabled: false
    listen_endpoints:
      - "udp/0.0.0.0:0?rel=1;mixed_rel=1;multistream=1"
    connect_endpoints: []
    seed_from_ip_table: false
    seed_port: 7448
  # PointCloud2 has a third, TCP-only session so bulk cloud traffic cannot
  # block control/state/service traffic in the control TCP session.
  cloud_session:
    enabled: true
    multicast_scouting: true
    gossip_scouting: true
    multicast_address: "224.0.0.225:7446"
    compression_enabled: false
    listen_endpoints:
      - "tcp/0.0.0.0:0"
    connect_endpoints: []
    seed_from_ip_table: false
    seed_port: 7449

services:
  # --------- Services ---------- #
  - srv_name: /add_two_ints
    srv_type: swarm_ros_bridge/AddTwoInts
    serverIp: drone1
    clientIp:
      - groundStation0
      - drone2
    prefix: true

topics:
# --------- Swarm Info ---------- #
- topic_name: /drone_0_ego_planner_node/rc_ctrl_marker
  msg_type: visualization_msgs/MarkerArray
  qos_class: bulk
  srcIP:
    - drone1
  max_freq: 20
  dstIP:
    - groundStation0
  prefix: false
  same_prefix: false

- topic_name: /drone_0_ego_planner_node/grid_map/occupancy_inflate
  msg_type: sensor_msgs/PointCloud2
  qos_class: bulk
  cloudCompress: true
  cloudDownsample: -1.0
  cloudCodec: draco
  srcIP:
    - drone1
  max_freq: 5
  dstIP:
    - groundStation0
  prefix: true
  same_prefix: true

- topic_name: /drone_0_ego_planner_node/grid_map/occupancy
  msg_type: sensor_msgs/PointCloud2
  qos_class: bulk
  cloudCompress: true
  cloudDownsample: -1.0
  cloudCodec: draco
  srcIP:
    - drone1
  max_freq: 5
  dstIP:
    - groundStation0
  prefix: true
  same_prefix: true

- topic_name: /ekf_quat/ekf_odom
  msg_type: nav_msgs/Odometry
  qos_class: state
  srcIP:
    - drone1
  max_freq: 30
  dstIP:
    - groundStation0
  prefix: false
  same_prefix: false

# - topic_name: /goal_with_id_from_station
#   msg_type: quadrotor_msgs/GoalSet
#   qos_class: command
#   srcIP:
#     - groundStation0
#   max_freq: -1
#   dstIP:
#     - drone0
#   prefix: true
#   same_prefix: true

- topic_name: /camera/color/image_raw
  msg_type: sensor_msgs/Image
  qos_class: bulk
  imgResizeRate: 1.0
  imgJpegQuality: 85
  imgAdaptiveQuality: true
  imgMinJpegQuality: 40
  imgMaxJpegQuality: 90
  imgTargetBandwidthKbps: 800
  imgQualityStep: 5
  imgAdaptCooldownFrames: 6
  srcIP:
    - drone1
  max_freq: 24
  dstIP:
    - groundStation0
  prefix: false
  same_prefix: false
