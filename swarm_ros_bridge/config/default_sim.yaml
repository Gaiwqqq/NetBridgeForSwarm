config:
  debug: false                    # for debug only
  odom_convert: true              # convert odom to posestamped using odom_convert_node
  monitor_node: true              # check recv rate
  warn_threshold: 3               # if recv rate smaller than max_freq-warn_threashold, then warn
  monitor_rate_hz: 500            # it must be greater than max_freq

zenoh:
  mode: peer
  multicast_scouting: true
  gossip_scouting: true
  compression_enabled: false
  listen_endpoints: []
  connect_endpoints: []
  service_timeout_ms: 1000
  service_worker_threads: 2
  service_queue_capacity: 64
  image_session:
    enabled: true
    multicast_scouting: true
    gossip_scouting: true
    compression_enabled: false
    listen_endpoints:
      - "udp/0.0.0.0:0?rel=1;mixed_rel=1;multistream=1"
    connect_endpoints: []
    seed_from_ip_table: false
    seed_port: 7448
  cloud_session:
    enabled: true
    multicast_scouting: true
    gossip_scouting: true
    multicast_address: "224.0.0.225:7446"
    compression_enabled: false
    listen_endpoints:
      - "tcp/0.0.0.0:0"
    connect_endpoints: []
    seed_from_ip_table: false
    seed_port: 7449

services:
  # --------- Services ---------- #
  - srv_name: /add_two_ints
    srv_type: swarm_ros_bridge/AddTwoInts
    serverIp: drone1
    clientIp:
      - drone2
      - drone3
    prefix: true

topics:
  # ---------- Topics ---------- #
  - topic_name: /drone_0_ego_planner_node/rc_ctrl_marker
    qos_class: bulk
    srcIP:
      - drone1
    max_freq: 20
    dstIP:
      - drone2
      - drone3
    prefix: true
    same_prefix: true

  - topic_name: /drone_0_ego_planner_node/grid_map/occupancy_inflate
    qos_class: bulk
    srcIP:
      - drone1
    max_freq: 5
    dstIP:
      - drone2
      - drone3
    prefix: true
    same_prefix: true

  - topic_name: /drone_0_ego_planner_node/grid_map/occupancy
    qos_class: bulk
    srcIP:
      - drone1
    max_freq: 5
    dstIP:
      - drone2
      - drone3
    prefix: true
    same_prefix: true

  - topic_name: /ekf_quat/ekf_odom
    qos_class: state
    srcIP:
      - drone1
    max_freq: 30
    dstIP:
      - drone2
      - drone3
    prefix: true
    same_prefix: true

  - topic_name: /camera/color/image_raw
    qos_class: bulk
    imgResizeRate: 0.5
    srcIP:
      - drone1
    max_freq: 24
    dstIP:
      - drone2
    prefix: true
    same_prefix: false
